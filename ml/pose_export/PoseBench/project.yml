# Source of truth for PoseBench.xcodeproj. After editing: `xcodegen generate` in this folder.
name: PoseBench
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  PoseCore:
    path: PoseCore
targets:
  PoseBench:
    type: application
    platform: iOS
    sources:
      # Synced folder: Xcode picks up whatever is on disk, so models exported after
      # cloning (gitignored) are compiled in without regenerating the project.
      - path: PoseBench
        type: syncedFolder
    dependencies:
      - package: PoseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.del0m.posebench
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PoseBench
        INFOPLIST_KEY_NSCameraUsageDescription: "PoseBench uses the camera to test the pose model on this phone. Video never leaves the device."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
schemes:
  PoseBench:
    build:
      targets:
        PoseBench: all
    # Benchmark numbers must come from an optimized build: in Debug the decode loop runs
    # unoptimized and inflates latency.
    run:
      config: Release
