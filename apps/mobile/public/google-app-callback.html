<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Return to SteadyForum</title>
  <style>body{margin:0;padding:48px 24px;background:#edf7fd;color:#173f59;font:18px system-ui;text-align:center}a{display:inline-block;margin-top:24px;padding:16px 24px;border-radius:24px;background:white;color:inherit;text-decoration:none;box-shadow:0 6px 24px #173f5914}</style>
</head>
<body>
  <h1>Return to SteadyForum</h1>
  <p>Finish signing in securely in the app.</p>
  <a id="return">Open SteadyForum</a>
  <script>
    const params = new URLSearchParams(location.search);
    const target = new URL('steadyforum://google-auth');
    const verifier = params.get('neon_auth_session_verifier');
    if (verifier && !params.has('error')) target.searchParams.set('neon_auth_session_verifier', verifier);
    else target.searchParams.set('error', 'google_sign_in_failed');
    history.replaceState(history.state, '', location.pathname);
    document.getElementById('return').href = target.href;
    location.replace(target.href);
  </script>
</body>
</html>
