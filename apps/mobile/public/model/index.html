import * as THREE from 'three';import{OrbitControls}from'./OrbitControls.js';import{GLTFLoader}from'./GLTFLoader.js';import{createMovement}from'./movement.js';
const native=Boolean(window.ReactNativeWebView);

 const transmission=THREE.ShaderChunk.transmission_pars_fragment.replace('transmittedLight = getTransmissionSample( refractionCoords, roughness, ior );',`transmittedLight = getTransmissionSample( refractionCoords, roughness, ior );
   vec4 surfaceClip = projMatrix * viewMatrix * vec4( position, 1.0 );

   float opaqueDistance = texture2D( opaqueDepth, refractionCoords ).r;

shader.uniforms.focusAmount=glowUniform;shader.uniforms.shimmerTime=shimmerUniform;shader.uniforms.armStart=armStart;shader.uniforms.armEnd=armEnd;shader.uniforms.armStartR=armStartR;shader.uniforms.armEndR=armEndR;shader.vertexShader='varying vec3 surfacePosition;\n'+shader.vertexShader.replace('#include <project_vertex>','surfacePosition = (modelMatrix * vec4(transformed,1.0)).xyz;\n#include <project_vertex>');shader.fragmentShader='varying vec3 surfacePosition; uniform float focusAmount; uniform float shimmerTime; uniform vec3 armStart; uniform vec3 armEnd; uniform vec3 armStartR; uniform vec3 armEndR;\n'+shader.fragmentShader.replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\nvec3 ab=armEnd-armStart;float along=clamp(dot(surfacePosition-armStart,ab)/max(dot(ab,ab),0.0001),0.0,1.0);vec3 offset=surfacePosition-(armStart+along*ab);float heat=exp(-dot(offset,offset)/0.004)*sin(along*3.14159)*focusAmount;vec3 abr=armEndR-armStartR;float ar=clamp(dot(surfacePosition-armStartR,abr)/max(dot(abr,abr),0.0001),0.0,1.0);vec3 offr=surfacePosition-(armStartR+ar*abr);heat+=exp(-dot(offr,offr)/0.004)*sin(ar*3.14159)*focusAmount;float wave=0.86+0.14*sin(shimmerTime*2.4+along*11.0);float sheen=exp(-pow((along-fract(shimmerTime*0.24))/0.16,2.0));totalEmissiveRadiance+=vec3(2.3,0.012,0.006)*heat*(wave+0.22*sheen);');};
const focusBounds=new THREE.Box3();let animation=null,selected=null,movement=null;const systemMotion=matchMedia('(prefers-reduced-motion: reduce)'),reduce={get matches(){return nativeReduced??systemMotion.matches}};let nativeReduced=null,active=true;
function notify(type,data={}){const message={type,...data};if(window.ReactNativeWebView)window.ReactNativeWebView.postMessage(JSON.stringify(message));else parent.postMessage(message,location.origin);}
function resize(){const{width,height}=stage.getBoundingClientRect();renderer.setSize(width,height);renderer.getDrawingBufferSize(bufferSize);depthTarget.setSize(Math.max(1,bufferSize.x),Math.max(1,bufferSize.y));camera.aspect=width/height;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();
controls.addEventListener('start',()=>{if(animation)animation.cameraCancelled=true});
// Native scroll gestures belong to the page; the React Native wrapper sends pinch zoom.
if(native)controls.enabled=false;
function zoom(factor){
 if(typeof factor!=='number'||!Number.isFinite(factor)||factor<.5||factor>2)return;
 if(animation)animation.cameraCancelled=true;
 const offset=camera.position.clone().sub(controls.target);
 offset.setLength(THREE.MathUtils.clamp(offset.length()*factor,controls.minDistance,controls.maxDistance));
 camera.position.copy(controls.target).add(offset);controls.update();
}
let rotationBase=new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target)).theta;
function rotate(degrees){
 if(typeof degrees!=='number'||!Number.isFinite(degrees))return;
 if(animation)animation.cameraCancelled=true;
 const offset=camera.position.clone().sub(controls.target),orbit=new THREE.Spherical().setFromVector3(offset);

}
let statusMotion=null;
function updateStatus(text){status.textContent=text;if(reduce.matches)return;statusMotion?.cancel();statusMotion=status.animate([{opacity:.3,transform:'translateY(3px)'},{opacity:1,transform:'translateY(0)'}],{duration:260,easing:'ease-out'});}
function select(id){
 const focus=Boolean(id);selected=id;movement.select(id);
 buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.exercise===id)));
 pauseButton.hidden=!focus;pauseButton.textContent=reduce.matches?'Play movement':'Pause movement';
 if(reduce.matches&&movement.playing)movement.pause();
 const target=id==='curl'?new THREE.Vector3(.12,1.22,.08):id==='press'?new THREE.Vector3(0,1.35,0):id==='push_up'?new THREE.Vector3(0,.29,-.06):new THREE.Vector3(0,.8,0);

}
buttons.forEach(button=>button.onclick=()=>select(button.dataset.exercise));
pauseButton.onclick=()=>{const playing=movement.pause();pauseButton.textContent=playing?'Pause movement':'Resume movement';};
try{const [gltf,dumbbell]=await Promise.all([new GLTFLoader().loadAsync('./rigged-human.glb'),new GLTFLoader().loadAsync('./dumbbell.glb')]);gltf.scene.traverse(o=>{if(o.isMesh){o.material=glass;o.frustumCulled=false;bodyMeshes.push(o);}});scene.add(gltf.scene);movement=createMovement(gltf.scene,dumbbell.scene);buttons.forEach(b=>b.disabled=false);document.body.classList.add('ready');status.textContent='';notify('steadyforum:model-ready');}catch(error){status.textContent='Model could not load. Please reload the preview.';notify('steadyforum:model-error');console.error(error)}

});

function receive(data){
 if(!movement)return;
 if(data?.type==='steadyforum:select'&&[null,'curl','squat','press','push_up','lunge'].includes(data.id))select(data.id);
 if(data?.type==='steadyforum:zoom')zoom(data.factor);
 if(data?.type==='steadyforum:rotate')rotate(data.degrees);
 if(data?.type==='steadyforum:pause'&&typeof data.playing==='boolean'&&movement.playing!==data.playing)movement.pause();

window.addEventListener('message',event=>{if(event.origin===location.origin&&event.source===parent)receive(event.data);});
</script></body></html>
